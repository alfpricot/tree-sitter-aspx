# =============================================================================
#  tree-sitter-aspx · GitHub Actions
# -----------------------------------------------------------------------------
#  File                gala-release.yml
#  Workflow name       Gala release
#  Type                Entrypoint (runs in this repo only)
#  Triggers            push (main branch)
#                      workflow_dispatch
#  Purpose             Cuts a release when a promotion lands on main. gala
#                      (configured in .gala.toml) reads the Conventional
#                      Commits since the latest tag, bumps the Cargo.toml
#                      version, writes the CHANGELOG.md entry, commits it
#                      (the commit body carries the skip-ci marker), tags it,
#                      pushes the branch and tag atomically, and then
#                      fast-forwards dev onto the release commit. When no
#                      release is due it changes nothing.
#
#                      The pushes go over the RELEASE_DEPLOY_KEY deploy key:
#                      this repo's rulesets require every change on main and
#                      dev to land through a pull request and block creating
#                      v* tags, and on a personal-account repository a deploy
#                      key is the bypass actor available to a workflow.
#
#                      The skip-ci marker in the release commit body can also
#                      suppress the tag-push trigger of release.yml, so after
#                      gala finishes this workflow dispatches release.yml
#                      itself for the tag that points at HEAD (nothing is
#                      dispatched when no release was due). The dispatch uses
#                      the tag as its ref because release.yml's provenance
#                      check needs GITHUB_REF to be the tag. release.yml's
#                      publish steps are safe to repeat, so a duplicate
#                      trigger is harmless.
# =============================================================================

name: Gala release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gala-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GALA_VERSION: 'v0.2.0'
  # gala v0.2.0 requires Go 1.27.3 or newer.
  GO_VERSION: '1.27.3'

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Job-level elevation: dispatching release.yml needs actions: write. The
    # git pushes authenticate with the deploy key, not the workflow token.
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (gala reads tags and history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # origin becomes an SSH remote authenticated by the deploy key, so
          # gala's atomic push and dev sync use the ruleset bypass.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Configure git identity
        # gala makes the release commit with the runner's git, which refuses
        # to commit without an identity.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install Rust toolchain
        # gala's cargo manager runs cargo to bump the version and refresh the lockfile.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install gala
        run: go install "github.com/alfpricot/gala/cmd/gala@${GALA_VERSION}"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/gala" release
      - name: Dispatch the publish workflow for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Succeeds only when a tag points at HEAD, i.e. this run cut a release.
          tag=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No release was due - nothing to publish."
            exit 0
          fi
          gh workflow run release.yml --ref "$tag" -f "tag=${tag}"
